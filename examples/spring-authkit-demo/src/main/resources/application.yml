spring:
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

spring:
  authkit:
    enabled: true
    authentication:
      identifier: email
    user:
      email:
        enabled: true
        required: true
      first-name:
        enabled: true
    password:
      min-length: 8
      require-lowercase: true
      require-number: true
    jwt:
      secret: "demo-secret-change-me-very-long-0123456789"
      access-token-expiration: 15m
      refresh-token-expiration: 30m
    email:
      verification-required: true
      otp-length: 6
      otp-expiration: 10m
      max-attempts: 5
    roles:
      allowed: [USER, ADMIN]
      default: USER
    permissions:
      enabled: false
    rate-limit:
      enabled: true
    security:
      account-lockout-enabled: true

logging:
  level:
    root: INFO
    io.github.devang559.authkit: DEBUG
